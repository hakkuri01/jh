# Ameba runs its default rules, scoped to our own code. The doc-comment and
# type-restriction rules stay off on purpose: this is a solo project with a
# minimal comment policy (see AGENTS.md), not a doc-commented library.

Globs:
  - "src/**/*.cr"
  - "spec/**/*.cr"

# `return nil if ...` is kept deliberately: in a method typed `: T?` the explicit
# nil documents the nullable return at the call site, which idiomatic Crystal
# prefers over a bare `return`. Off, so the explicit form is allowed.
Style/RedundantNilInControlExpression:
  Enabled: false

# Short block parameter names (`rs`, `c`, `i`) are idiomatic Crystal, so this
# rule is off. Names still earn their length where it aids reading.
Naming/BlockParameterName:
  Enabled: false

# `.not_nil!` is how a spec asserts a value is present: the assertion IS the
# point, and a failure there is a clear test failure, not a production crash.
# Still a real smell in `src/`, where it stays linted.
Lint/NotNil:
  Excluded:
    - "spec/**/*.cr"

# Files under spec/support are helpers required by specs, not spec files
# themselves, so they do not end in _spec.cr.
Lint/SpecFilename:
  Excluded:
    - "spec/support/**/*.cr"
