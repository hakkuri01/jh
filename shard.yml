name: jekyll_hyde
version: 0.1.0

description: |
  A single-binary terminal web fuzzer with two modes: Hyde for broad recursive
  content discovery, Jekyll for precise templated fuzzing.

authors:
  - hakkuri

license: MIT

crystal: ">= 1.21.1, < 2.0.0"

targets:
  jh:
    main: src/jekyll_hyde.cr

# No `dependencies` key, on purpose: the shipped binary uses the standard
# library only. Ameba is the one development dependency, pinned to a commit
# (a tag can move, a commit cannot) and built by the justfile, so no install
# script runs.
development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    commit: 9a19f5f98abdf792a5a0ef6ca5c5d89459740e2f
